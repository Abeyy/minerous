# Builds Minerous for all three platforms and publishes them to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#   npm version patch     # bumps package.json and creates the tag
#   git push --follow-tags
#
# electron-builder reads `build.publish` in package.json, uploads the installers to
# the release for that tag, and — importantly — also uploads the latest*.yml manifests
# that electron-updater polls. Without those manifests the app can't detect updates.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Each runner can only build its own platform's installers.
        #
        # Windows only for now: NSIS auto-update works on an unsigned build, whereas
        # macOS silently refuses to install unsigned updates (Squirrel.Mac checks the
        # signature) and would ship a release that looks updatable but isn't. Add
        # `ubuntu-latest` back whenever you want AppImage builds — those also update
        # unsigned — and `macos-latest` once you have a Developer ID certificate.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # supabase.config.json is gitignored, so CI has no credentials file. The app
      # treats a missing config as "cloud sync unavailable" and still runs, so builds
      # succeed without secrets — add them here if you want cloud sync in releases.
      # GITHUB_TOKEN is provided automatically and can write releases in this repo —
      # no secret to configure. (Publishing to a *different* repo would need a PAT.)
      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
