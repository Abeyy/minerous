# Builds Minerous for all three platforms and publishes them to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#   npm version patch     # bumps package.json and creates the tag
#   git push --follow-tags
#
# electron-builder reads `build.publish` in package.json, uploads the installers to
# the release for that tag, and — importantly — also uploads the latest*.yml manifests
# that electron-updater polls. Without those manifests the app can't detect updates.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Each runner can only build its own platform's installers.
        #
        # Windows only for now: NSIS auto-update works on an unsigned build, whereas
        # macOS silently refuses to install unsigned updates (Squirrel.Mac checks the
        # signature) and would ship a release that looks updatable but isn't. Add
        # `ubuntu-latest` back whenever you want AppImage builds — those also update
        # unsigned — and `macos-latest` once you have a Developer ID certificate.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # supabase.config.json is gitignored, so CI has no credentials file. The app
      # treats a missing config as "cloud sync unavailable" and still runs, so builds
      # succeed without secrets — add them here if you want cloud sync in releases.
      #
      # Build only. Uploading is a separate, explicit step below: electron-builder's
      # own publisher can report success while quietly uploading nothing, which is
      # exactly what happened on v0.1.1.
      - name: Build
        run: npx electron-builder --publish never

      # Printed so a failed upload is diagnosable from the log alone, rather than
      # having to guess whether the artifacts were ever produced.
      - name: List build output
        shell: bash
        run: ls -lh release

      # The installer named in latest.yml must exist under exactly that name, or every
      # update 404s while the release still looks perfectly healthy. See v0.1.2.
      - name: Verify update manifest matches the built files
        run: node scripts/check-release-assets.js

      # Attached to the Actions run itself, so the installer is downloadable even if
      # the release step fails.
      - uses: actions/upload-artifact@v4
        with:
          name: minerous-windows
          path: |
            release/*.exe
            release/latest.yml

      # Without a body the release publishes with an empty description, which is what
      # v0.1.1 shipped as. Pull the matching section out of CHANGELOG.md instead.
      - name: Build release notes
        shell: bash
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" > release-notes.md

      # draft: false is the important part — a draft release is invisible to
      # electron-updater, so players would never be offered the update.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
